[env:rp2350_touch_lcd]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_touch_lcd_35
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps = https://github.com/Mictronics/scpi-parser.git#0c2e239761dc154623b9486d8c4eb563fbb629b8
; Vrekrer limits: params/tokens per command, total tokens, total commands, 16-bit hash.
build_flags =
	-I${platformio.packages_dir}/framework-arduinopico/variants
	-DSCPI_ARRAY_SYZE=24
	-DSCPI_MAX_TOKENS=40
	-DSCPI_MAX_COMMANDS=48
	-DSCPI_HASH_TYPE=uint16_t
	-DSCPI_QUOTE_AWARE
	-DFW_VERSION=\"0.1.0\"
